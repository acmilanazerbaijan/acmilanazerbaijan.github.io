<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AC Milan Azerbaijan – Milan xəbərləri</title>
<meta name="description" content="AC Milan Azerbaijan – Milan xəbərləri, start heyətləri, oyunçu qiymətləri, Seriya A cədvəli və təqvim. Azərbaycan dilində.">
<meta property="og:title" content="AC Milan Azerbaijan">
<meta property="og:description" content="Milanın gündəlik xəbərləri Azərbaycan dilində">
<meta property="og:image" content="https://acmilanazerbaijan.github.io/logo.png">
<meta name="theme-color" content="#0e0b0c">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0b0c;--panel:#171214;--panel2:#1d1719;--line:#2a2124;--text:#f4efef;--muted:#a99c9f;--red:#d3112e;--red2:#8e0b1f}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.stripes{height:5px;background:repeating-linear-gradient(90deg,var(--red) 0 40px,#000 40px 80px)}
.wrap{max-width:1200px;margin:auto;padding:0 16px}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(14,11,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:46px}
.brand b{font-weight:800;font-size:17px;letter-spacing:.4px;line-height:1.1}
.brand b span{color:var(--red);display:block;font-size:12px;letter-spacing:2px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;color:#d9cfd1}
.nav a:hover{background:var(--panel)}
.nav a.on{color:#fff;background:var(--red)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:18px}
@media(max-width:760px){.burger{display:block}.nav{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px}.nav.open{display:flex}}
/* ticker */
.ticker{background:var(--red2);font-size:13px;overflow:hidden;white-space:nowrap}
.ticker .wrap{display:flex;gap:10px;align-items:center;height:34px}
.ticker b{background:#000;padding:2px 8px;border-radius:4px;font-size:11px;letter-spacing:1px}
.ticker .run{overflow:hidden;flex:1}
.ticker .run span{display:inline-block;padding-left:100%;animation:tk 60s linear infinite}
@keyframes tk{to{transform:translateX(-100%)}}
/* layout */
.page{display:grid;grid-template-columns:1fr 340px;gap:28px;padding-top:24px;padding-bottom:48px}
.page>*{min-width:0}
@media(max-width:960px){.page{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:#e9dfe1}
.sec-h:before{content:"";width:4px;height:18px;background:var(--red);border-radius:2px}
/* hero */
.hero{display:block;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:22px;background:var(--panel)}
.hero img{width:100%;aspect-ratio:16/9;object-fit:cover}
.hero .cap{padding:18px 20px 20px}
.hero h1{margin:8px 0 6px;font-size:26px;line-height:1.25}
.hero p{margin:0;color:#d4c9cb}
.hero:hover h1{color:#ff5b70}
/* grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media(max-width:620px){.grid{grid-template-columns:1fr}.hero h1{font-size:21px}}
.nc{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.nc:hover{transform:translateY(-3px);border-color:var(--red2)}
.nc img{aspect-ratio:16/9;object-fit:cover;width:100%}
.nc .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.nc h3{margin:0;font-size:16.5px;line-height:1.35}
.nc p{margin:0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{background:var(--red);color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:.8px;font-size:10.5px;padding:3px 8px;border-radius:5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.filters button.on{background:var(--red);border-color:var(--red)}
.loadmore{display:block;margin:22px auto 0;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 22px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
/* article */
.art{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.art img{width:100%;aspect-ratio:16/9;object-fit:cover}
.art .in{padding:22px 26px 28px}
.art h1{font-size:28px;line-height:1.25;margin:10px 0 16px}
.art .txt{white-space:pre-line;font-size:16.5px;line-height:1.75;color:#e6dcde}
.art .src{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
.art .src a{color:#fff;text-decoration:underline}
.back{display:inline-block;margin-bottom:14px;color:var(--muted);font-weight:600}
.back:hover{color:#fff}
@media(max-width:620px){.art .in{padding:18px}.art h1{font-size:22px}.art .txt{font-size:15.5px}}
.related{margin-top:26px}
/* sidebar */
aside{display:flex;flex-direction:column;gap:18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.next{background:linear-gradient(135deg,var(--red2),#1a0a0e);border-color:var(--red2);text-align:center}
.vs{display:flex;align-items:center;justify-content:space-around;margin:12px 0 8px}
.vs .tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px;width:110px}
.vs .x{font-size:20px;font-weight:800;color:#f2d6da}
.when{color:#f2d6da;font-size:13px}
.cd{display:flex;gap:8px;justify-content:center;margin-top:12px}
.cd div{background:rgba(0,0,0,.35);border-radius:8px;padding:6px 8px;min-width:54px}
.cd b{display:block;font-size:20px}
.cd span{font-size:10px;color:#e8c9ce;text-transform:uppercase}
.crest{width:22px;height:22px;object-fit:contain;flex:none}
.crest.lg{width:58px;height:58px}
.crest.md{width:34px;height:34px}
.fb{display:inline-grid;place-items:center;border-radius:50%;font-weight:800;flex:none;border:2px solid}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:11px}
td.t{text-align:left}
td.t div{display:flex;align-items:center;gap:8px}
tr.milan td{background:rgba(211,17,46,.22);font-weight:700}
.z1{box-shadow:inset 3px 0 #2f7de1}.z2{box-shadow:inset 3px 0 #e07a26}.z3{box-shadow:inset 3px 0 #b3263a}
.note{color:var(--muted);font-size:11.5px;margin-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:#0003;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px;font:inherit;font-size:12.5px;cursor:pointer}
.tabs button.on{border-color:var(--red);background:rgba(211,17,46,.2)}
.fx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.fx:last-child{border:0}
.fx small{display:block;color:var(--muted);font-size:12px}
.inj{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.inj:last-child{border:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.inj small{display:block;color:var(--muted);font-size:12px;margin-left:14px}
.more-link{display:block;text-align:center;margin-top:10px;color:#ff6a7d;font-weight:600;font-size:13px}
/* contact */
.contact{max-width:640px}
.contact p{color:#d4c9cb}
.form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.form label{font-size:13px;font-weight:600;color:#d9cfd1;display:flex;flex-direction:column;gap:6px}
.form input,.form textarea,.form select{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;padding:10px 12px}
.form input:focus,.form textarea:focus,.form select:focus{outline:2px solid var(--red);border-color:transparent}
.btn{background:#1877f2;color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn svg{width:20px;height:20px;fill:#fff}
.socials{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.socials a{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:13.5px}
.socials a:hover{border-color:var(--red)}
.socials svg{width:17px;height:17px;fill:currentColor}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
footer .wrap{padding:22px 16px 36px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
footer img{height:38px}
.empty{color:var(--muted);padding:20px 0}
.crests{display:flex;gap:4px;margin-left:auto;align-items:center}
.crests .crest{background:#fff1;border-radius:50%;padding:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 18px}
.chip{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="stripes"></div>
<div class="top">
  <div class="wrap bar">
    <a class="brand" href="#/"><img src="logo.png" alt="AC Milan Azerbaijan"><b>AC MILAN<span>AZERBAIJAN</span></b></a>
    <button class="burger" id="burger" aria-label="Menyu">☰</button>
    <nav class="nav" id="nav">
      <a href="#/" data-r="home">Xəbərlər</a>
      <a href="#/cedvel" data-r="cedvel">Cədvəl</a>
      <a href="#/teqvim" data-r="teqvim">Təqvim</a>
      <a href="#/elaqe" data-r="elaqe">Əlaqə</a>
    </nav>
  </div>
</div>
<div class="ticker"><div class="wrap"><b>SON DƏQİQƏ</b><div class="run"><span id="ticker"></span></div></div></div>

<div class="wrap page">
  <main id="main"><div class="empty">Yüklənir…</div></main>
  <aside id="side">
    <div class="box next" id="next"></div>
    <div class="box"><h2 class="sec-h">Cədvəl</h2><div class="tabs" id="tabs"></div><div id="table"></div><a class="more-link" href="#/cedvel">Tam cədvəl →</a></div>
    <div class="box"><h2 class="sec-h">Növbəti oyunlar</h2><div id="fixtures"></div></div>
    <div class="box"><h2 class="sec-h">Zədəlilər və cəzalılar</h2><div id="injuries"></div></div>
    <div class="box"><h2 class="sec-h">Qolçular · Seriya A</h2><div id="scorers"></div></div>
  </aside>
</div>

<footer><div class="wrap">
  <div style="display:flex;align-items:center;gap:10px"><img src="logo.png" alt=""><div>© AC Milan Azerbaijan · @acm.azerbaijan<br>Qeyri-rəsmi azarkeş saytı. AC Milan klubu ilə rəsmi əlaqəsi yoxdur.</div></div>
  <div id="gen"></div>
</div></footer>

<script src="logos.js"></script>
<script>
/* ===== Ayarlar ===== */
const CONFIG={
  facebook:"https://www.facebook.com/acmilan.azerbaijan.official/",               // Facebook səhifəsinin linki
  instagram:"https://www.instagram.com/acm.azerbaijan/",
  youtube:"https://www.youtube.com/@acm.azerbaijan",
  tiktok:"https://www.tiktok.com/@acm.azerbaijan"
};
/* Klub loqoları – logos.js faylındadır (window.LOGOS) */
const LOGOS=window.LOGOS||{};
const logoUrl=t=>LOGOS[t]?`https://a.espncdn.com/i/teamlogos/soccer/500/${LOGOS[t]}.png`:null;
/* Xəbərdə adı keçən klubları tap (Milan xaric) */
const TEAM_NAMES=Object.keys(LOGOS).filter(n=>n!=='Milan'&&n!=='AC Milan').sort((a,b)=>b.length-a.length);
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const TEAM_RE=new RegExp('(^|[^\\p{L}])('+TEAM_NAMES.map(reEsc).join('|')+')(?![\\p{L}])','gu');
function teamsIn(i){const txt=[i.title,i.summary,i.body].join(' \n ');const seen=new Map();let m;TEAM_RE.lastIndex=0;
  while((m=TEAM_RE.exec(txt))){const id=LOGOS[m[2]];if(!seen.has(id))seen.set(id,m[2])}
  const out=[...seen.values()];return out.length?['Milan',...out].slice(0,5):[]}
function crestRow(i,size){const t=teamsIn(i);if(!t.length)return '';return `<div class="crests">${t.map(n=>`<span title="${esc(n)}">${crest(n,'',size||24)}</span>`).join('')}</div>`}
function crestChips(i){const t=teamsIn(i);if(!t.length)return '';return `<div class="chips">${t.map(n=>`<span class="chip">${crest(n,'',22)}${esc(n)}</span>`).join('')}</div>`}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fallback(t,size,c1,c2){const s=size||22;const ab=(t||'?').replace(/[^A-Za-zÀ-ž]/g,'').slice(0,3).toUpperCase();return `<span class="fb" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.32)}px;background:${esc(c1||'#2a2124')};color:${esc(c2||'#fff')};border-color:${esc(c2||'#3a3033')}">${esc(ab)}</span>`}
function crest(t,cls,size,c1,c2){const u=logoUrl(t);if(!u)return fallback(t,size,c1,c2);const fb=fallback(t,size,c1,c2).replace(/"/g,'&quot;');return `<img class="crest ${cls||''}" src="${u}" alt="${esc(t)}" loading="lazy" onerror="this.outerHTML='${fb.replace(/'/g,"\\'")}'">`}
const SVG={
 ig:'<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0 8.2a3.2 3.2 0 110-6.4 3.2 3.2 0 010 6.4zM17.3 5.5a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4zM12 2c-2.7 0-3.1 0-4.1.1C3.6 2.3 2.3 3.6 2.1 7.9 2 8.9 2 9.3 2 12s0 3.1.1 4.1c.2 4.3 1.5 5.6 5.8 5.8 1 .1 1.4.1 4.1.1s3.1 0 4.1-.1c4.3-.2 5.6-1.5 5.8-5.8.1-1 .1-1.4.1-4.1s0-3.1-.1-4.1c-.2-4.3-1.5-5.6-5.8-5.8C15.1 2 14.7 2 12 2zm0 1.8c2.7 0 3 0 4 .1 3.2.1 4 1 4.1 4.1.1 1 .1 1.3.1 4s0 3-.1 4c-.1 3.1-.9 4-4.1 4.1-1 .1-1.3.1-4 .1s-3 0-4-.1c-3.2-.1-4-1-4.1-4.1-.1-1-.1-1.3-.1-4s0-3 .1-4C4 4.8 4.8 4 8 3.9c1-.1 1.3-.1 4-.1z"/></svg>',
 yt:'<svg viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 00-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 001 7.2 31 31 0 00.6 12 31 31 0 001 16.8a3 3 0 002.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 002.1-2.1 31 31 0 00.4-4.8 31 31 0 00-.4-4.8zM9.7 15V9l5.8 3-5.8 3z"/></svg>',
 tt:'<svg viewBox="0 0 24 24"><path d="M16.6 2h-3.4v13.4a2.9 2.9 0 11-2.9-2.9c.3 0 .6 0 .9.1V9.1a6.4 6.4 0 106.4 6.3V8.6a8.2 8.2 0 004.4 1.3V6.5a4.8 4.8 0 01-4.6-4.5z"/></svg>',
 fb:'<svg viewBox="0 0 24 24"><path d="M24 12a12 12 0 10-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v2.9h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0024 12z"/></svg>'
};
const EMO=[[/zədə|sağlamlıq|tibbi/i,'🚑'],[/transfer|müqavilə/i,'🔄'],[/mətbuat|konfrans/i,'🎤'],[/müsahibə|açıqlama/i,'🎙️'],[/start|ilk 11/i,'📋'],[/qiymət|reytinq/i,'📊'],[/nəticə|oyun/i,'⚽'],[/statistika|rekord/i,'📈'],[/heyət/i,'👥'],[/rəsmi/i,'✅'],[/iddia|şayiə/i,'👀']];
const emo=k=>(EMO.find(([r])=>r.test(k||''))||[,'📰'])[1];
const AZM=['yanvar','fevral','mart','aprel','may','iyun','iyul','avqust','sentyabr','oktyabr','noyabr','dekabr'];
function baku(iso){const d=new Date(new Date(iso).getTime()+4*3600e3);return `${d.getUTCDate()} ${AZM[d.getUTCMonth()]}, ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`}
function ago(iso){const m=Math.round((Date.now()-new Date(iso))/60000);if(m<60)return m+' dəq əvvəl';const h=Math.round(m/60);if(h<24)return h+' saat əvvəl';return baku(iso)}
const strip=t=>(t||'').replace(/^[\p{Extended_Pictographic}️‍\s]+/u,'');

let D,filter='Hamısı',shown=9,tab='serieA';
const $=id=>document.getElementById(id);

/* ===== Səhifələr ===== */
function card(i){return `<a class="nc" href="#/xeber/${i.id}">${i.img?`<img src="${i.img}" alt="${esc(strip(i.title))}" loading="lazy">`:''}<div class="in"><div class="meta"><span class="tag">${emo(i.kind)} ${esc(i.kind)}</span><span>${ago(i.date)}</span>${crestRow(i,22)}</div><h3>${esc(strip(i.title))}</h3><p>${esc(i.summary||'')}</p></div></a>`}
function home(){
  const kinds=['Hamısı',...new Set(D.items.map(i=>i.kind))];
  const list=D.items.filter(i=>filter==='Hamısı'||i.kind===filter);
  const [h,...rest]=list;
  $('main').innerHTML=`${h?`<a class="hero" href="#/xeber/${h.id}">${h.img?`<img src="${h.img}" alt="${esc(strip(h.title))}">`:''}<div class="cap"><div class="meta"><span class="tag">${emo(h.kind)} ${esc(h.kind)}</span><span>${ago(h.date)}</span>${crestRow(h,26)}</div><h1>${esc(strip(h.title))}</h1><p>${esc(h.summary||'')}</p></div></a>`:''}
  <h2 class="sec-h">Son xəbərlər</h2>
  <div class="filters">${kinds.map(k=>`<button class="${k===filter?'on':''}" data-k="${esc(k)}">${k==='Hamısı'?'':emo(k)+' '}${esc(k)}</button>`).join('')}</div>
  <div class="grid">${rest.slice(0,shown).map(card).join('')||'<div class="empty">Bu kateqoriyada xəbər yoxdur.</div>'}</div>
  ${rest.length>shown?'<button class="loadmore" id="lm">Daha çox xəbər</button>':''}`;
  document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.k;shown=9;home()});
  if($('lm'))$('lm').onclick=()=>{shown+=9;home()};
}
function article(id){
  const i=D.items.find(x=>x.id===id);
  if(!i){$('main').innerHTML='<a class="back" href="#/">← Bütün xəbərlər</a><div class="empty">Xəbər tapılmadı.</div>';return}
  document.title=strip(i.title)+' – AC Milan Azerbaijan';
  const rel=D.items.filter(x=>x.id!==id&&x.kind===i.kind).slice(0,2);
  const more=rel.length<2?D.items.filter(x=>x.id!==id&&!rel.includes(x)).slice(0,2-rel.length):[];
  $('main').innerHTML=`<a class="back" href="#/">← Bütün xəbərlər</a>
  <article class="art">${i.img?`<img src="${i.img}" alt="${esc(strip(i.title))}">`:''}<div class="in">
  <div class="meta"><span class="tag">${emo(i.kind)} ${esc(i.kind)}</span><span>${baku(i.date)} (Bakı vaxtı)</span></div>
  <h1>${esc(strip(i.title))}</h1>${crestChips(i)}<div class="txt">${esc(i.body)}</div>
  <div class="src">📰 Mənbə: ${i.sourceUrl?`<a href="${esc(i.sourceUrl)}" target="_blank" rel="noopener">${esc(i.source)}</a>`:esc(i.source)}</div></div></article>
  <div class="related"><h2 class="sec-h">Digər xəbərlər</h2><div class="grid">${[...rel,...more].map(card).join('')}</div></div>`;
}
function tableHtml(t,full){
  const z=p=>(t.zones||[]).find(z=>p>=z.from&&p<=z.to)?.cls||'';
  let rows=t.rows;
  if(!full){const mi=rows.findIndex(r=>r.team==='Milan');const s=Math.max(0,Math.min(rows.length-8,mi-3));rows=rows.slice(s,s+8)}
  const hasG=full&&rows[0]&&rows[0].gf!=null;
  return `<table><tr><th>#</th><th class="t" style="text-align:left">Komanda</th><th>O</th>${full?'<th>Q</th><th>H</th><th>M</th>':''}${hasG?'<th>VQ</th><th>BQ</th>':''}<th>TF</th><th>X</th></tr>${rows.map(r=>`<tr class="${r.team==='Milan'?'milan':''}"><td class="${z(r.pos)}">${r.pos}</td><td class="t"><div>${crest(r.team)}${esc(r.team)}</div></td><td>${r.p}</td>${full?`<td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>`:''}${hasG?`<td>${r.gf}</td><td>${r.ga}</td>`:''}<td>${r.gd>0?'+':''}${r.gd}</td><td><b>${r.pts}</b></td></tr>`).join('')}</table>
  <div class="note">${(t.zones||[]).map(z=>`<span class="${z.cls}" style="padding-left:7px;margin-right:8px">${esc(z.label)}</span>`).join('')}<br>${esc(t.note||'')}${t.source?' · Mənbə: '+esc(t.source):''}</div>`;
}
function standings(){
  $('main').innerHTML=['serieA','europaLeague'].filter(k=>D[k]).map(k=>`<div class="box" style="margin-bottom:20px"><h2 class="sec-h">${esc(D[k].title||k)}</h2>${tableHtml(D[k],true)}</div>`).join('');
}
function fxRow(f,big){const opp=crest(f.opp,big?'md':'',big?34:22,f.c1,f.c2);const mil=crest('Milan',big?'md':'',big?34:22);
  const w=f.utc?baku(f.utc):(f.date?(()=>{const [y,m,d]=f.date.split('-');return `${+d} ${AZM[m-1]}`})():'')+' (vaxt bəlli deyil)';
  return `<div class="fx">${f.home?mil+opp:opp+mil}<div><b>${f.home?'Milan – '+esc(f.opp):esc(f.opp)+' – Milan'}</b><small>${esc(f.comp)} · ${esc(f.venue||'')}<br>${w}</small></div></div>`}
function calendar(){
  const it=D.fixtures?.items||[];
  $('main').innerHTML=`<div class="box"><h2 class="sec-h">Milanın növbəti oyunları</h2>${it.map(f=>fxRow(f,true)).join('')}<div class="note">Vaxtlar Bakı vaxtı ilə (UTC+4)</div></div>`;
}
function contact(){
  $('main').innerHTML=`<div class="contact"><h2 class="sec-h">Bizimlə əlaqə</h2>
  <p>Sualınız, təklifiniz və ya əməkdaşlıq istəyiniz var? Adınızı və mesajınızı yazın – sizi Facebook səhifəmizə yönləndirəcəyik, orada bizə birbaşa yaza bilərsiniz.</p>
  <form class="form" id="cf">
    <label>Adınız və soyadınız<input name="ad" required placeholder="Məs.: Tural Əzimov" autocomplete="name"></label>
    <label>Mövzu<select name="movzu"><option>Ümumi sual</option><option>Təklif / irad</option><option>Əməkdaşlıq və reklam</option><option>Xəbər göndərmək</option></select></label>
    <label>Mesajınız<textarea name="mesaj" rows="5" placeholder="Mesajınızı bura yazın…"></textarea></label>
    <button class="btn" type="submit">${SVG.fb} Facebook-da bizə yazın</button>
  </form>
  <div class="socials"><a href="${CONFIG.facebook}" target="_blank" rel="noopener">${SVG.fb} Facebook</a><a href="${CONFIG.instagram}" target="_blank" rel="noopener">${SVG.ig} Instagram</a><a href="${CONFIG.youtube}" target="_blank" rel="noopener">${SVG.yt} YouTube</a><a href="${CONFIG.tiktok}" target="_blank" rel="noopener">${SVG.tt} TikTok</a></div></div>`;
  $('cf').onsubmit=e=>{e.preventDefault();const ad=e.target.ad.value.trim();if(!ad)return;
    e.target.querySelector('.btn').innerHTML=SVG.fb+' Təşəkkürlər, '+esc(ad.split(' ')[0])+'! Facebook açılır…';
    setTimeout(()=>{window.open(CONFIG.facebook,'_blank','noopener')},700)};
}
/* ===== Yan panel ===== */
function side(){
  const f=(D.fixtures?.items||[]).find(x=>x.utc&&new Date(x.utc)>new Date());const el=$('next');
  if(!f){el.innerHTML='<h2 class="sec-h">Növbəti oyun</h2><div class="when">Təqvim yenilənir</div>'}else{
  const A=f.home?'Milan':f.opp,B=f.home?f.opp:'Milan';
  el.innerHTML=`<h2 class="sec-h" style="justify-content:center">Növbəti oyun</h2><div class="vs"><div class="tm">${crest(A,'lg',58,A===f.opp?f.c1:0,A===f.opp?f.c2:0)}${esc(A)}</div><div class="x">VS</div><div class="tm">${crest(B,'lg',58,B===f.opp?f.c1:0,B===f.opp?f.c2:0)}${esc(B)}</div></div><div class="when">${esc(f.comp)} · ${esc(f.venue)}<br><b>${baku(f.utc)}</b> (Bakı vaxtı)</div><div class="cd" id="cd"></div>`;
  const tick=()=>{let s=Math.max(0,(new Date(f.utc)-new Date())/1000);$('cd').innerHTML=[[86400,'gün'],[3600,'saat'],[60,'dəq'],[1,'san']].map(([k,l])=>{const v=Math.floor(s/k);s-=v*k;return `<div><b>${v}</b><span>${l}</span></div>`}).join('')};tick();setInterval(tick,1000)}
  const opts=[['serieA','Seriya A'],['europaLeague','Avropa Liqası']].filter(([k])=>D[k]);
  const rt=()=>{$('tabs').innerHTML=opts.map(([k,l])=>`<button class="${k===tab?'on':''}" data-k="${k}">${l}</button>`).join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;rt()});if(D[tab])$('table').innerHTML=tableHtml(D[tab],false)};rt();
  $('fixtures').innerHTML=(D.fixtures?.items||[]).slice(0,4).map(f=>fxRow(f,false)).join('')+'<a class="more-link" href="#/teqvim">Bütün təqvim →</a>';
  const c={injured:'#d3112e',doubt:'#e0a526',suspended:'#9b59b6',warned:'#e6d33a'},l={injured:'Zədəli',doubt:'Şübhəli',suspended:'Cəzalı',warned:'Cəza həddində'};
  $('injuries').innerHTML=(D.injuries?.items||[]).map(i=>`<div class="inj"><span class="dot" style="background:${c[i.status]||'#888'}"></span><b>${esc(i.player)}</b> <span style="color:var(--muted);font-size:12px">${esc(i.pos)} · ${l[i.status]||''}</span><small>${esc(i.reason)}${i.ret?' — qayıdış: '+esc(i.ret):''}</small></div>`).join('')+`<div class="note">${esc(D.injuries?.note||'')}</div>`;
  const p=(D.scorers?.players||[]).slice().sort((a,b)=>b.goals-a.goals||b.assists-a.assists);
  $('scorers').innerHTML=`<table><tr><th class="t" style="text-align:left">Oyunçu</th><th>⚽ Qol</th><th>🅰️ Ötürmə</th></tr>${p.map(x=>`<tr><td class="t">${esc(x.player)}</td><td><b>${x.goals}</b></td><td>${x.assists}</td></tr>`).join('')}</table><div class="note">${esc(D.scorers?.note||'')}</div>`;
  $('ticker').textContent=D.items.slice(0,6).map(i=>strip(i.title)).join('   •   ');
}
/* ===== Router ===== */
function route(){
  const h=location.hash.replace(/^#\/?/,'');const [r,id]=h.split('/');
  document.title='AC Milan Azerbaijan – Milan xəbərləri';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===(r||'home')||(r==='xeber'&&a.dataset.r==='home')));
  $('nav').classList.remove('open');
  if(r==='xeber')article(id);else if(r==='cedvel')standings();else if(r==='teqvim')calendar();else if(r==='elaqe')contact();else home();
  window.scrollTo(0,0);
}
$('burger').onclick=()=>$('nav').classList.toggle('open');
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;side();route();window.onhashchange=route;$('gen').textContent='Son yenilənmə: '+baku(d.generated)+' (Bakı)'})
.catch(()=>$('main').innerHTML='<div class="empty">Məlumat yüklənmədi.</div>');
</script>
</body>
</html>
